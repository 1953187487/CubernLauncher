name: Build Cubern Launcher 1.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Rust & cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Release
        env:
          CUBERN_KEYSTORE_PASSWORD: "Cubern@103!"
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :ZalithLauncher:assembleRelease --no-daemon --max-workers=2 -Darch=arm64 -Dorg.gradle.jvmargs=-Xmx4096M
      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find ZalithLauncher/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          gh release upload v1.0.2 "$APK" --clobber
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cubern-1.0
          path: ZalithLauncher/build/outputs/apk/release/*.apk
