name: Build & Release Cubern Launcher 1.0.6
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Release APK
        env:
          MOVTERY_KEYSTORE_PASSWORD: "Cubern@103!"
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :ZalithLauncher:assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2048M
      - name: Create Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find ZalithLauncher/build/outputs/apk/release -name "*.apk" | head -1)
          printf "%s\n" "## Cubern Launcher 1.0.6" "" "- 重写关于界面+动画UI+赞助者，重写贡献者鸣谢，修复关于字样" "- 修复陶瓦联机入口/后台重开误启动游戏/强制退出改回主页" "- 中文搜索自动转英文且不修改输入，修复搜索页" "- 整合包更新入口与版本管理，新增3D皮肤预览(旋转/动作/跳舞)" "" "作者：鹙鸟 · 爱发电：https://afdian.com/@KZjewnk" > notes.md
          gh release create v1.0.6 "$APK" --title "Cubern Launcher 1.0.6 (Pre-release)" --notes-file notes.md --prerelease
