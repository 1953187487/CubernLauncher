name: Build & Release Cubern Launcher 1.0.7
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Release APK
        env:
          MOVTERY_KEYSTORE_PASSWORD: "Cubern@103!"
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :ZalithLauncher:assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2048M
      - name: Create Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find ZalithLauncher/build/outputs/apk/release -name "*.apk" | head -1)
          printf "%s\n" "## Cubern Launcher 1.0.7" "" "- 引入 skinview3d 真 3D 皮肤渲染（Three.js）：站立/行走/奔跑/挥手/跳舞/自动旋转" "- 账户页新增 3D 皮肤预览入口" "- 每日 0 点自动刷新赞助者列表并本地缓存（离线可见）" "- 彻底修复游戏菜单陶瓦联机回主页问题" "- 关于页重写统一风格、账号入口、更新动画，贡献者鸣谢载入真实仓库与作者名" "- 绑定爱发电赞助者凭据" "" "作者：鹙鸟 · 爱发电：https://afdian.com/@KZjewnk" > notes.md
          gh release create v1.0.7 "$APK" --title "Cubern Launcher 1.0.7 (Pre-release)" --notes-file notes.md --prerelease
