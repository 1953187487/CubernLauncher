name: Build & Release Cubern Launcher 1.0.5 (based on 1.0.4)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.5
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up JDK 8 (for jre_lwjgl3glfw toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Install NDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Release APK
        env:
          CUBERN_KEYSTORE_PASSWORD: "Cubern@103!"
        run: ./gradlew :CubernLauncher:assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2048M
      - name: Create Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find CubernLauncher/build/outputs/apk/release -name "*.apk" | head -1)
          printf "%s\n" "## Cubern Launcher 1.0.5（基于 1.0.4 底层重建）" "" "> 本次从真正的 1.0.4 代码基准重建，修复此前 APK 回到原版的问题。" "" "- 关于页重写为 Cubern 自主内容（开发基础 / 作者鹙鸟 / 贡献者鸣谢 / 检查更新）" "- 对接爱发电 Open API，URL_SUPPORT 改为鹙鸟主页 afdian.com/@KZjewnk" "- 赞助者金额分级配色：<0.1 青绿、0.1-1 黄、1-10 红、10-100 粉红、>=100 太极色" "- 修复搜索平台：默认 Modrinth + CurseForge 失败自动回退" "- 修复更新与下载地址指向 1953187487/CubernLauncher" "- 设置侧栏保留实验性下方独立的管理控制布局与关于入口" "- 版本号 1.0.5 (code 6)" "" "作者：鹙鸟（B站同名） · 爱发电：https://afdian.com/@KZjewnk" > notes.md
          gh release create v1.0.5 "$APK" --title "Cubern Launcher 1.0.5 (Pre-release)" --notes-file notes.md --prerelease
