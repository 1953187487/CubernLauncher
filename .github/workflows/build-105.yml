name: Build & Release Cubern Launcher 1.0.8
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.8
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Release APK
        env:
          MOVTERY_KEYSTORE_PASSWORD: "Cubern@103!"
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :ZalithLauncher:assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2048M
      - name: Create Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find ZalithLauncher/build/outputs/apk/release -name "*.apk" | head -1)
          printf "%s\n" "## Cubern Launcher 1.0.8" "" "- 修复3D皮肤预览崩溃（Manifest注册SkinPreviewActivity）" "- 修复陶瓦联机（VPN服务声明+移除双重初始化）" "- 实验性设置移除重复的关于/控制布局入口" "- 关于页重写为原版列表样式+动画" "- 修复检查更新（新增launcher_version.json）" "" "作者：鹙鸟 · 爱发电：https://afdian.com/@KZjewnk" > notes.md
          gh release upload v1.0.8 "$APK" --clobber
