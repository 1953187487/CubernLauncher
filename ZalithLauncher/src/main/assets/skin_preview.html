<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#141d18;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="skin_container"></canvas>
<script src="skinview3d.bundle.js"></script>
<script>
var viewer = new skinview3d.SkinViewer({canvas: document.getElementById('skin_container'), width: window.innerWidth, height: window.innerHeight, skin: window.Android ? Android.getSkinUrl() : 'skin.png'});
viewer.autoRotate = false;
viewer.zoom = 1.0;
viewer.cameraLight.intensity = 0.8;
viewer.globalLight.intensity = 2.2;
function setAnimation(name){
  var A = skinview3d;
  var map = {
    idle: A.IdleAnimation, walk: A.WalkingAnimation, run: A.RunningAnimation,
    fly: A.FlyingAnimation, wave: A.WaveAnimation, dance: A.DanceAnimation
  };
  var Cls = map[name] || A.IdleAnimation;
  viewer.animation = new Cls();
}
function setAutoRotate(v){ viewer.autoRotate = !!v; }
function reset(){ viewer.animation = null; viewer.autoRotate = true; }
window.setSkinUrl = function(u){ viewer.loadSkin(u); };
window.setAnimation = setAnimation;
window.setAutoRotate = setAutoRotate;
window.reset = reset;
<\/script></body></html>
